name: Deploy ExpenseTracker

on:
  push:
    branches:
      - main # change if using another branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /var/www/expensetracker

            echo "📥 Pull latest code"
            git fetch origin main
            git reset --hard origin/main
            git pull origin main

            echo "🧹 Flatten project: keep .env, promote /backend to root"
            if [ -f ".env" ]; then
              cp .env /tmp/expensetracker.env.bak
            fi

            # Remove everything except backend source, git metadata, and .env
            find . -mindepth 1 -maxdepth 1 \
              ! -name backend \
              ! -name .git \
              ! -name .env \
              -exec rm -rf {} +

            # Move backend contents to root (including dotfiles)
            shopt -s dotglob nullglob
            mv backend/* .
            shopt -u dotglob nullglob
            rmdir backend || true

            # Restore .env to ensure it is never overwritten
            if [ -f "/tmp/expensetracker.env.bak" ]; then
              mv -f /tmp/expensetracker.env.bak .env
            fi

            echo "📦 Install dependencies"
            composer install --no-dev --optimize-autoloader

            echo "🛢️ Run migrations"
            php artisan migrate --force

            echo "🌱 Run seed (only if not already seeded)"
              if [ ! -f "storage/app/seeded.flag" ]; then
                php artisan db:seed --force
                mkdir -p storage/app
                touch storage/app/seeded.flag
              fi

            echo "⚙️ Laravel optimize"
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔐 Fix permissions"
            sudo chown -R www-data:www-data /var/www/expensetracker
            sudo chmod -R 775 storage bootstrap/cache

            echo "🔄 Restart services"
            sudo systemctl restart php8.2-fpm
            sudo systemctl reload nginx

            echo "✅ Deployment complete"
